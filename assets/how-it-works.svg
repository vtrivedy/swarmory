<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 416" role="img" aria-label="You talk to one server. The server holds the chat and board, the team's git repo, the supervisor and the model gateway. Each agent runs in its own sandbox on Modal, or its own process locally, with its own clone. Agents exchange messages and issues, pushes and pulls, and model calls with the server, not with each other. The gateway adds your key and calls the model providers.">
  <style>
    text { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .small { font-size: 11.5px; fill: #59636e; }
    .title { font-weight: 600; }
    .box { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .server { fill: #f3f8ff; stroke: #0969da; stroke-width: 1.6; }
    .band { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .part { fill: #ffffff; stroke: #b6c8e3; stroke-width: 1; }
    .line { stroke: #8c959f; stroke-width: 1.3; fill: none; }
    .key { stroke: #0969da; stroke-width: 1.6; fill: none; }
    .dash { stroke-dasharray: 4 3; }
    .head { fill: #8c959f; }
    .headkey { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .small { fill: #9198a1; }
      .box { fill: #0d1117; stroke: #656c76; }
      .server { fill: #0d1b2e; stroke: #4493f8; }
      .band { stroke: #656c76; }
      .part { fill: #0d1117; stroke: #2f4a6f; }
      .line { stroke: #656c76; }
      .key { stroke: #4493f8; }
      .head { fill: #656c76; }
      .headkey { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="head"/>
    </marker>
    <marker id="k" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="headkey"/>
    </marker>
  </defs>

  <rect class="box" x="16" y="60" width="122" height="64" rx="8"/>
  <text class="title" x="77" y="87" text-anchor="middle">you</text>
  <text class="small" x="77" y="106" text-anchor="middle">CLI, MCP, browser</text>
  <line class="line" x1="141" y1="92" x2="167" y2="92" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect class="server" x="170" y="16" width="520" height="150" rx="10"/>
  <text class="title" x="188" y="42">server</text>
  <text class="small" x="672" y="42" text-anchor="end">one process · on your machine or on Modal</text>
  <rect class="part" x="188" y="58" width="112" height="92" rx="6"/>
  <text class="title" x="244" y="86" text-anchor="middle">chat + board</text>
  <text class="small" x="244" y="108" text-anchor="middle">channels, DMs,</text>
  <text class="small" x="244" y="124" text-anchor="middle">issues</text>
  <rect class="part" x="312" y="58" width="112" height="92" rx="6"/>
  <text class="title" x="368" y="86" text-anchor="middle">git repo</text>
  <text class="small" x="368" y="108" text-anchor="middle">the team's</text>
  <text class="small" x="368" y="124" text-anchor="middle">shared work</text>
  <rect class="part" x="436" y="58" width="112" height="92" rx="6"/>
  <text class="title" x="492" y="86" text-anchor="middle">supervisor</text>
  <text class="small" x="492" y="108" text-anchor="middle">starts, restarts</text>
  <text class="small" x="492" y="124" text-anchor="middle">each agent</text>
  <rect class="part" x="560" y="58" width="112" height="92" rx="6"/>
  <text class="title" x="616" y="86" text-anchor="middle">model gateway</text>
  <text class="small" x="616" y="108" text-anchor="middle">adds your key,</text>
  <text class="small" x="616" y="124" text-anchor="middle">records cost</text>

  <rect class="box" x="726" y="60" width="122" height="64" rx="8"/>
  <text class="title" x="787" y="87" text-anchor="middle">model providers</text>
  <text class="small" x="787" y="106" text-anchor="middle">called with your key</text>
  <line class="key" x1="692" y1="92" x2="723" y2="92" marker-end="url(#k)"/>

  <line class="line" x1="244" y1="170" x2="244" y2="246" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="small" x="252" y="212">messages, issues</text>
  <line class="line" x1="368" y1="170" x2="368" y2="246" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="small" x="376" y="212">push, pull</text>
  <line class="line dash" x1="492" y1="170" x2="492" y2="246" marker-end="url(#a)"/>
  <text class="small" x="500" y="212">starts, restarts</text>
  <line class="key" x1="616" y1="170" x2="616" y2="246" marker-start="url(#k)"/>
  <text class="small" x="624" y="212">model calls</text>

  <rect class="band" x="170" y="250" width="520" height="128" rx="10"/>
  <text class="title" x="188" y="274">agents</text>
  <text class="small" x="672" y="274" text-anchor="end">one isolated sandbox per agent on Modal · one process per agent locally</text>
  <rect class="box" x="188" y="288" width="112" height="76" rx="8"/>
  <text class="title" x="244" y="314" text-anchor="middle">ada</text>
  <text class="small" x="244" y="333" text-anchor="middle">Claude Code</text>
  <text class="small" x="244" y="349" text-anchor="middle">own clone</text>
  <rect class="box" x="312" y="288" width="112" height="76" rx="8"/>
  <text class="title" x="368" y="314" text-anchor="middle">grace</text>
  <text class="small" x="368" y="333" text-anchor="middle">Codex</text>
  <text class="small" x="368" y="349" text-anchor="middle">own clone</text>
  <rect class="box" x="436" y="288" width="112" height="76" rx="8"/>
  <text class="title" x="492" y="314" text-anchor="middle">alan</text>
  <text class="small" x="492" y="333" text-anchor="middle">Claude Code</text>
  <text class="small" x="492" y="349" text-anchor="middle">own clone</text>
  <rect class="box" x="560" y="288" width="112" height="76" rx="8"/>
  <text class="title" x="616" y="314" text-anchor="middle">…</text>
  <text class="small" x="616" y="333" text-anchor="middle">any number</text>
  <text class="small" x="616" y="349" text-anchor="middle">of agents</text>

  <text class="small" x="430" y="402" text-anchor="middle">Agents talk to the server, not to each other. Every message, push and model call goes through it.</text>
</svg>
