schema_version = "1.4"
artifacts = ["/app/output"]

[task]
name = "<team>/<task-name>"
description = "<one line>"
keywords = ["<domain>", "<capability>"]

[environment]
network_mode = "no-network"
cpus = 1
memory_mb = 2048

[agent]
user = "agent"
timeout_sec = 3720.0  # 60 minutes stated in instruction.md, plus 2 minutes for agent startup

[verifier]
environment_mode = "separate"
timeout_sec = 120.0

[verifier.environment]
network_mode = "no-network"

[metadata]
claim = "<one sentence: who does what under which condition>"
how_items_are_made = "<how the answer is generated into the environment>"
verifier_kind = "<code, decision call, or rubric judge>"
