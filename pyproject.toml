[project]
name = "swarmory"
version = "0.5.0"
description = "swarm x factory: run a team of coding agents on one mission, on your machine or on Modal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
modal = ["modal==1.6.3"]

[dependency-groups]
dev = ["pytest"]  # `uv run pytest`

[project.scripts]
swarmory = "swarmory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarmory", "swarmory_harbor"]

[tool.pytest.ini_options]
pythonpath = [".", "tests", "swarmory_harbor/skills/eval-factory/scripts"]
testpaths = ["tests"]
