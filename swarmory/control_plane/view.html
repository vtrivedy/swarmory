<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>swarmory</title>
<style>
:root {
  --bg: #ffffff; --side: #f5f5f3; --panel: #fafaf9; --raise: #ffffff;
  --line: #e7e6e2; --line-2: #efeeea;
  --text: #17181c; --ink-2: #3c3f48; --nav: #2b2d34; --text-2: #5c5f6a; --text-3: #6b6e78;
  --hover: rgba(23, 24, 28, .05);
  --sel: #e3e5fa; --sel-text: #232e9e;
  --accent: #3d4bdb; --accent-soft: #eef0fd; --accent-ink: #2a36b8; --on-accent: #ffffff;
  --code-bg: #f5f5f3; --cell: #f3f2ef; --bar: #f0efec;
  --todo: #6b6e78; --todo-fill: #c9cbd1; --doing: #8a5c00; --doing-fill: #e0a126;
  --done: #1e9461; --done-ink: #146b45; --done-soft: #e8f5ee; --done-line: #bfe3d2;
  --canceled: #b3362e; --bad-soft: #fbeeec; --bad-line: #efc4bf; --quiet: #c9c8c2;
  --shadow: 0 1px 2px rgba(20, 18, 14, .06), 0 8px 28px rgba(20, 18, 14, .10);
  --p0: #4353d6; --p1: #0f8577; --p2: #c2416b; --p3: #a8650b; --p4: #7a4fc9; --p5: #1977ad; --p6: #44801d; --p7: #bd4b24;
  --p8: #890028; --p9: #62187a; --p10: #0e318f; --p11: #00580d; --p12: #774e6d; --p13: #6f4a05; --p14: #005d6f; --p15: #ab52a9; --p16: #4c4691; --p17: #8a1f68; --p18: #6c6c42; --p19: #786b9e;
  --human: #3a3c44; --on-av: #ffffff;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181b; --side: #1d1e22; --panel: #1a1b1f; --raise: #222327;
    --line: #2c2e34; --line-2: #25272c;
    --text: #ececee; --ink-2: #c9cbd1; --nav: #d5d6db; --text-2: #a6a9b2; --text-3: #8c8f99;
    --hover: rgba(255, 255, 255, .06);
    --sel: rgba(139, 150, 245, .2); --sel-text: #c5cbff;
    --accent: #8b96f5; --accent-soft: rgba(139, 150, 245, .16); --accent-ink: #aeb6ff; --on-accent: #14162e;
    --code-bg: #222328; --cell: #24262b; --bar: #2a2c32;
    --todo: #8c8f99; --todo-fill: #555861; --doing: #e0a93a; --doing-fill: #d39a2a;
    --done: #3dba85; --done-ink: #6ad3a4; --done-soft: rgba(61, 186, 133, .14); --done-line: rgba(61, 186, 133, .35);
    --canceled: #ea7b71; --bad-soft: rgba(234, 123, 113, .12); --bad-line: rgba(234, 123, 113, .35); --quiet: #4a4c54;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 32px rgba(0, 0, 0, .45);
    --p0: #7c89f0; --p1: #2bb3a3; --p2: #e06a93; --p3: #d39a3a; --p4: #a583ea; --p5: #4aaee6; --p6: #7dbb55; --p7: #e98058;
    --p8: #f2c8ef; --p9: #00f9db; --p10: #e9dc4b; --p11: #adcfac; --p12: #f28ee4; --p13: #ffb88e; --p14: #b7a9d2; --p15: #80d8fe; --p16: #8fe47d; --p17: #939855; --p18: #fe93a1; --p19: #0cd6ac;
    --human: #8a8d97; --on-av: #15161a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; }
section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
h2 { font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; }
.tnum, time { font-variant-numeric: tabular-nums; }
.mono, .iid, .csha { font-family: var(--mono); }
.iid { font-size: 12px; color: var(--text-3); flex: none; }
.lk { color: var(--accent-ink); font-size: 13px; font-weight: 500; text-decoration: none; }
.lk:hover { text-decoration: underline; }
.cap { font-size: 12.5px; color: var(--text-2); }
.ghost { padding: 40px 28px; color: var(--text-3); font-size: 13.5px; }
.none { font-size: 13px; color: var(--text-3); }

/* ---------- frame: sidebar, one main pane, the time bar under it ---------- */
#app { display: grid; height: 100vh; height: 100dvh; grid-template: "side main" minmax(0, 1fr) "side tl" auto / 256px minmax(0, 1fr); }
#side { grid-area: side; background: var(--side); padding: 18px 12px 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
#main { grid-area: main; display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; border-left: 1px solid var(--line); }
#rail { grid-area: rail; display: none; background: var(--panel); border-left: 1px solid var(--line); padding: 20px 22px; overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
#tl { grid-area: tl; border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--panel); }
@media (min-width: 1180px) {
  body[data-mode=conv] #app { grid-template: "side main rail" minmax(0, 1fr) "side tl rail" auto / 256px minmax(0, 1fr) 320px; }
  body[data-mode=conv] #rail { display: flex; flex-direction: column; gap: 26px; }
}

/* ---------- avatars: a square in the member's colour with an initial ---------- */
.av { flex: none; width: 36px; height: 36px; border-radius: 9px; display: inline-grid; place-items: center; color: var(--on-av); font-weight: 700; font-size: 15px; user-select: none; background: var(--p0); }
.av.s32 { width: 32px; height: 32px; border-radius: 8px; font-size: 14px; }
.av.s26 { width: 26px; height: 26px; border-radius: 7px; font-size: 12px; }
.av.s20, .av.s22 { width: 20px; height: 20px; border-radius: 6px; font-size: 11px; }
.av.s22 { width: 22px; height: 22px; }
.av.s16 { width: 16px; height: 16px; border-radius: 5px; font-size: 9px; }
.sglyph { flex: none; display: inline-grid; width: 16px; height: 16px; }
.sglyph svg { width: 16px; height: 16px; }
.dot { flex: none; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--quiet); }
.dot.on { background: var(--done); }

/* ---------- sidebar ---------- */
.ws { padding: 0 10px; display: flex; flex-direction: column; gap: 6px; }
.ws-name { font-size: 17px; font-weight: 700; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-st { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ws-st .dot { width: 8px; height: 8px; }
#filter { flex: none; margin: -8px 0; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); color: var(--text); font: 13px var(--sans); outline: none; width: 100%; }
#filter:focus { border-color: var(--accent); }
#nav { display: contents; }
.sec { display: flex; flex-direction: column; gap: 2px; }
.sec-h { padding: 0 10px 4px; font-size: 12px; font-weight: 600; color: var(--text-3); }
.row { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; flex: none; padding: 0 10px; border-radius: 8px; color: var(--nav); font-weight: 450; }
.row.view { height: 34px; gap: 10px; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); color: var(--sel-text); font-weight: 600; }
.row .ic { width: 16px; flex: none; text-align: center; color: var(--text-3); }
.row .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; unicode-bidi: isolate; }
.row .cnt { flex: none; font-size: 12px; font-weight: 500; color: var(--text-3); font-variant-numeric: tabular-nums; }
.row.sel :is(.ic, .cnt, .iid) { color: inherit; }
.row .ring { flex: none; width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--todo); }
.row .ring.on { background: var(--done); box-shadow: none; }
.pairs { display: flex; flex: none; }
.pairs .av + .av { margin-left: -5px; box-shadow: 0 0 0 2px var(--side); }
.row.sel .pairs .av + .av { box-shadow: 0 0 0 2px var(--sel); }
.tog { padding: 4px 10px 0 34px; font-size: 12.5px; color: var(--text-2); }
.tog:hover { color: var(--text); }
.sec .none { padding: 2px 10px; }

/* ---------- the pane's header ---------- */
#head { flex: none; display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 28px; border-bottom: 1px solid var(--line); }
.hbtn { display: none; width: 32px; height: 32px; border-radius: 8px; place-items: center; color: var(--text-2); flex: none; margin-left: -6px; }
.hbtn:hover { background: var(--hover); }
.hbtn svg { width: 18px; height: 18px; }
#headMain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; white-space: nowrap; }
#headMain h1 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 40px; unicode-bidi: isolate; }
.hsub { color: var(--text-2); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 9999 auto; }
.hmono { font: 12.5px var(--mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 99 auto; }
#headRight { flex: none; color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.state { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 20px; background: var(--cell); color: var(--ink-2); font-size: 13px; font-weight: 600; }
.state.on { background: var(--done-soft); color: var(--done-ink); }

/* ---------- panes ---------- */
.pane { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.pane[hidden], #jump[hidden] { display: none; }
.page { padding: 24px 28px 32px; display: flex; flex-direction: column; gap: 28px; }
.split { display: flex; flex-wrap: wrap; gap: 28px 36px; }
.split > * { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.g3 { flex: 3 1 420px; } .g2 { flex: 2 1 280px; } .g1 { flex: 1 1 260px; } .gfull { flex: 1 1 100%; }
.sh { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.ox { overflow-x: auto; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tile { padding: 16px 18px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
.tile .k, .tile .s { font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.tile .v { font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }
.kv { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 8px; font-variant-numeric: tabular-nums; }
.kv b { display: block; font-size: 16px; font-weight: 650; }
.kv span { font-size: 12px; color: var(--text-3); }
.key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.key span { display: flex; align-items: center; gap: 6px; }
.sw { flex: none; width: 10px; height: 10px; border-radius: 3px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { font-size: 11px; fill: var(--text-3); font-family: var(--sans); font-variant-numeric: tabular-nums; }
svg.chart text.now { fill: var(--text); font-weight: 600; }
svg.chart .gl { stroke: var(--line-2); } svg.chart .ax { stroke: var(--line); }
svg.chart .nowl { stroke: var(--text); stroke-dasharray: 3 3; }
.meter { height: 10px; border-radius: 5px; background: var(--bar); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
.bars { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13.5px; }
.bars .nm { display: flex; align-items: center; gap: 8px; font-weight: 500; min-width: 0; }
.bars .n { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- a conversation ---------- */
.msgs { padding: 14px 0 14px; max-width: 920px; }
.msg { display: grid; grid-template-columns: 36px minmax(0, 1fr); column-gap: 12px; padding: 8px 28px; position: relative; }
.msg.cont { padding-top: 0; margin-top: -4px; }
.msg .gut { position: relative; }
.msg .gtime { display: none; position: absolute; right: 0; top: 3px; font-size: 10.5px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.msg.cont:hover .gtime { display: block; }
.mh { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.mh .nm { font-weight: 650; font-size: 14.5px; }
.mh time { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.mh .verb { font-size: 12.5px; color: var(--text-3); }
.mh .ctx { font-size: 11.5px; font-weight: 600; color: var(--text-3); border-radius: 4px; padding: 0 5px; background: var(--hover); }
.mh .ctx:hover { color: var(--text); }
.tx { font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; unicode-bidi: plaintext; }
.att { display: inline-block; margin: 6px 6px 0 0; padding: 3px 8px; font: 12.5px/1.4 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; }
.tx code { font: 12.6px/1 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; }
.tx pre, .ib pre, .note pre { margin: 4px 0; padding: 8px 10px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 7px; overflow-x: auto; white-space: pre; }
.tx pre code, .ib pre code, .note pre code { font: 12.5px/1.5 var(--mono); background: none; border: 0; padding: 0; }
.lnk { color: var(--accent-ink); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 2px; overflow-wrap: anywhere; }
.tx.clamp:not(.open) { max-height: 21em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.more-tx { font-size: 12px; font-weight: 600; color: var(--text-3); padding: 2px 0; }
.more { display: block; margin: 6px auto; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; color: var(--text-3); background: var(--hover); }
.more[hidden] { display: none; }
.mn { color: var(--accent-ink); background: var(--accent-soft); border-radius: 4px; padding: 0 2px; font-weight: 600; }
.mn.all { color: var(--doing); background: color-mix(in srgb, var(--doing) 15%, transparent); }
.iref, button.sha { color: var(--accent-ink); font-weight: 600; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 2px; }
.pill, .thr { display: inline-flex; align-items: center; margin: 6px 6px 0 0; padding: 2px 10px; border-radius: 20px; background: var(--accent-soft); color: var(--accent-ink); font-size: 12.5px; font-weight: 500; }
.thr:hover, .thr.sel { box-shadow: inset 0 0 0 1px var(--accent); }
.qcard { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; width: 100%; max-width: 560px; margin-top: 3px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13.5px; }
button.qcard:hover { border-color: var(--todo); }
.qcard .csha { font-size: 12.5px; color: var(--text-2); }
.qcard .what { flex: 1; min-width: 120px; overflow-wrap: anywhere; unicode-bidi: plaintext; }
.qcard.job .what { font: 12.5px var(--mono); color: var(--ink-2); min-width: 160px; }
.qcard .res { font-weight: 600; }
.qcard.done { border-color: var(--done-line); background: var(--done-soft); } .qcard.done .res { color: var(--done-ink); }
.qcard.failed { border-color: var(--bad-line); background: var(--bad-soft); } .qcard.failed .res { color: var(--canceled); }
.add { color: var(--done-ink); } .del { color: var(--canceled); }
.add, .del { font: 12.5px var(--mono); }
mark { background: color-mix(in srgb, var(--doing-fill) 32%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.hit { cursor: pointer; border-bottom: 1px solid var(--line-2); }
.msg.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.act { display: flex; align-items: flex-start; gap: 12px; padding: 3px 28px; font-size: 13px; color: var(--text-2); }
.act .aic { width: 36px; flex: none; display: flex; justify-content: center; padding-top: 2px; color: var(--text-3); }
.act .aic svg { width: 14px; height: 14px; }
.act .abody { min-width: 0; flex: 1; }
.act .who { font-weight: 600; color: var(--text); }
.act time { margin-left: 8px; font-size: 12px; color: var(--text-3); }
.act .note { display: block; margin-top: 3px; padding: 2px 10px; border-left: 2px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.st { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--c); vertical-align: -2px; }
.st svg { width: 14px; height: 14px; }
.st-todo { --c: var(--todo); } .st-doing { --c: var(--doing); } .st-done { --c: var(--done); } .st-canceled { --c: var(--todo); }
.divider { display: flex; align-items: center; gap: 12px; padding: 10px 28px 6px; font-size: 12px; font-weight: 500; color: var(--text-3); }
.divider::before, .divider::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.intro { padding: 10px 28px 8px; color: var(--text-2); font-size: 13.5px; }
.icard { margin: 6px 28px 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; }
.icard .im { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); }
.icard .im b { color: var(--text); font-weight: 600; }
.icard .ib { margin-top: 8px; white-space: pre-wrap; overflow-wrap: anywhere; unicode-bidi: plaintext; }
#jump { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); height: 30px; padding: 0 14px; border-radius: 15px; background: var(--accent); color: var(--on-accent); font-size: 12.5px; font-weight: 600; box-shadow: var(--shadow); }
#banner { position: absolute; top: 68px; left: 50%; transform: translateX(-50%); display: none; padding: 6px 12px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line); color: var(--text-2); font-size: 12.5px; box-shadow: var(--shadow); z-index: 5; }
#banner.on { display: block; }

/* ---------- right panel of a conversation ---------- */
.big { display: flex; align-items: baseline; gap: 8px; }
.big b { font-size: 32px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.big span { color: var(--text-2); font-size: 13.5px; }
#rail .meter { height: 6px; }
.now { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; }
.now .nm { display: block; font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.now .stt { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.now .usd { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.stackbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }

/* ---------- board ---------- */
.board { display: flex; flex-wrap: wrap; min-height: 100%; }
.blist { flex: 3 1 480px; min-width: 0; padding: 20px 28px; display: flex; flex-direction: column; gap: 18px; }
.blist section { gap: 0; }
.bside { flex: 2 1 380px; min-width: 0; border-left: 1px solid var(--line); background: var(--panel); padding: 20px 24px; display: flex; flex-direction: column; gap: 26px; }
.bside section { gap: 8px; }
.gh { display: flex; align-items: center; gap: 9px; height: 36px; padding: 0 12px; border-radius: 8px; background: var(--side); font-weight: 600; font-size: 13.5px; }
.gh .n { color: var(--text-3); font-weight: 500; font-variant-numeric: tabular-nums; }
.irow { display: grid; grid-template-columns: 16px 34px minmax(0, 1fr) auto 96px; gap: 12px; align-items: center; width: 100%; height: 46px; padding: 0 12px; border-bottom: 1px solid var(--line-2); }
.irow:hover { background: var(--hover); }
.irow .ttl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; unicode-bidi: isolate; }
.irow .who { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.irow .when { font-size: 12.5px; color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.blist .tog { padding: 8px 12px 0; }
.life { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; height: var(--lh, 22px); }
.life:hover .iid { color: var(--text); }
.life > span:last-child { position: relative; height: 12px; }
.life i { position: absolute; top: 4px; height: 4px; min-width: 4px; border-radius: 6px; background: var(--todo-fill); }
.life i.doing { top: 0; height: 12px; } .life i.done { background: var(--done); } .life i.canceled { background: var(--line); }

/* ---------- cost and tokens ---------- */
.tbl { width: 100%; min-width: 820px; border-collapse: collapse; text-align: right; font-variant-numeric: tabular-nums; }
.tbl :is(th, td) { height: 46px; padding: 0 8px; border-bottom: 1px solid var(--line-2); font-weight: inherit; white-space: nowrap; }
.tbl :is(th, td):nth-child(-n+2) { text-align: left; }
.tbl thead th { height: auto; padding: 8px; font-size: 12px; font-weight: 600; color: var(--text-3); border-bottom-color: var(--line); }
.tbl tfoot :is(th, td) { font-weight: 700; border-bottom: 0; }
.tbl tr[data-agent] { cursor: pointer; }
.tbl tr[data-agent]:hover { background: var(--hover); }
.tbl .nm { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.tbl .mono { font-size: 12.5px; color: var(--ink-2); }
.tbl b { font-weight: 600; }

/* ---------- patterns ---------- */
.heat { display: grid; grid-template-columns: var(--lab, 76px) repeat(var(--n), minmax(0, 1fr)); gap: 4px; align-items: center; }
.heat .nm { font-weight: 500; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.heat .c { display: grid; place-items: center; height: var(--ch, 30px); border-radius: 6px; background: var(--cell); }
.heat .c i { border-radius: 50%; background: var(--bg); }
.heat.ax { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.heat.ax span { overflow: visible; width: 0; }
.mx .nm { text-align: right; padding-right: 6px; font-size: 13px; }
.mx .hd { display: grid; place-items: center; font-size: 12px; color: var(--text-2); overflow: hidden; }
.mx .c { height: var(--ch, 38px); border-radius: 7px; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text); }
.mx .c.self { background: none; }
button.c:hover { box-shadow: 0 0 0 2px var(--accent); }
.hist { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.hist.b { align-items: end; height: 150px; }
.hist.b > div { display: flex; flex-direction: column; align-items: center; gap: 6px; justify-content: flex-end; height: 100%; font-weight: 600; font-variant-numeric: tabular-nums; }
.hist.b i { width: 100%; min-height: 3px; border-radius: 6px 6px 0 0; background: var(--accent); }
.hist.b i.z { background: var(--line); }
.hist.l { font-size: 12px; color: var(--text-2); text-align: center; }
.lead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.lead > :nth-child(3n) { grid-column: 1 / -1; }
.lead .who { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-weight: 600; }
.lead > .cap:nth-child(n+3) { margin-top: 10px; }

/* ---------- one agent ---------- */
.strip { position: relative; height: 22px; }
.strip::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--line-2); }
.strip i { position: absolute; top: 2px; height: 18px; min-width: 3px; border-radius: 9px; }
.axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.axis :last-child { color: var(--text); font-weight: 600; }
.drow { display: grid; grid-template-columns: 44px 92px minmax(0, 1fr); gap: 12px; width: 100%; padding: 8px 0; border-bottom: 1px solid var(--line-2); align-items: baseline; }
button.drow:hover { background: var(--hover); }
.drow time { font-size: 12px; color: var(--text-3); }
.drow .kd { font-size: 12.5px; font-weight: 500; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow .kd.good { color: var(--done-ink); }
.drow .tx { font-size: 14px; white-space: normal; }
.drow .nt { color: var(--text-3); font-size: 12.5px; }
.aside { gap: 24px !important; }
.aside section { gap: 8px; font-size: 13.5px; }
.talk { grid-template-columns: 22px auto minmax(0, 1fr) auto; }
.talk .meter { height: 8px; }
.aside button.il { display: block; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aside button.il:hover { color: var(--accent-ink); }

/* ---------- time bar ---------- */
#tl { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 28px calc(8px + env(safe-area-inset-bottom)); font-size: 13px; font-variant-numeric: tabular-nums; }
#liveBtn { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--raise); color: var(--ink-2); font-weight: 600; white-space: nowrap; }
#liveBtn.at { cursor: default; color: var(--text-3); }
#liveBtn.at.live { border-color: var(--done); color: var(--done-ink); }
#liveBtn.at.live .dot { background: var(--done); }
#liveBtn:not(.at) { border-color: var(--accent); color: var(--accent-ink); }
#liveBtn:not(.at) .dot { background: var(--accent); }
#play { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--text); color: var(--bg); flex: none; }
#play svg { width: 12px; height: 12px; }
#tlA { font-weight: 600; min-width: 34px; }
#tlB, .tl-hint { color: var(--text-2); white-space: nowrap; }
#track { flex: 1; min-width: 80px; position: relative; height: 28px; cursor: pointer; touch-action: none; }
#track .tb, #track .tf { position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: var(--line); pointer-events: none; }
#track .tf { right: auto; background: var(--accent); }
#marks i { position: absolute; top: 4px; width: 2px; height: 6px; margin-left: -1px; border-radius: 1px; pointer-events: none; }
#track .tt { position: absolute; top: 6px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--raise); border: 2px solid var(--accent); pointer-events: none; }
#tip { position: absolute; bottom: calc(100% + 4px); transform: translateX(-50%); padding: 4px 8px; border-radius: 6px; background: var(--text); color: var(--bg); font-size: 11.5px; font-weight: 600; white-space: nowrap; pointer-events: none; display: none; }
.seg { display: flex; flex: none; gap: 2px; background: var(--hover); border-radius: 8px; padding: 2px; }
.seg button { height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--text-3); }
.seg button.on { background: var(--raise); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

/* ---------- drawer: a commit's patch, or a message's replies ---------- */
#drawer { display: none; }
#drawer.on { display: flex; flex-direction: column; position: absolute; inset: 0 0 0 auto; width: min(680px, 100%); z-index: 6; background: var(--bg); border-left: 1px solid var(--line); box-shadow: var(--shadow); }
.dhead { flex: none; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--line); }
.hcol { flex: 1; min-width: 0; }
.htitle { font-weight: 700; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; unicode-bidi: isolate; }
.hcol .hsub { display: block; font-size: 12.5px; white-space: nowrap; }
.xbtn { flex: none; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--text-2); }
.xbtn:hover { background: var(--hover); }
.xbtn svg { width: 14px; height: 14px; }
#dScroller { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
#dMsgs .msg, #dMsgs .act { padding-left: 20px; padding-right: 20px; }

/* ---------- commits ---------- */
.clist { max-width: 920px; padding: 6px 0 18px; }
.crow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 28px; border-bottom: 1px solid var(--line-2); }
button.crow:hover { background: var(--hover); }
.crow.sel { background: var(--sel); }
.cmain { flex: 1; min-width: 0; }
.cs { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; unicode-bidi: isolate; }
.cmeta { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
.csha { font-size: 12px; color: var(--text-2); }
.rf .cs { color: var(--canceled); }
.cdet { display: grid; gap: 12px; padding: 14px 20px 28px; min-width: 0; }
.cbody { color: var(--text-2); font-size: 13.5px; }
.cfiles, .df { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.cf, .dfh { display: flex; gap: 10px; width: 100%; padding: 6px 12px; font: 12px/1.5 var(--mono); }
.cf + .cf { border-top: 1px solid var(--line-2); }
.cf:hover { background: var(--hover); }
.cf span:first-child, .dfh span:first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.dfh { background: var(--side); border-bottom: 1px solid var(--line); font-weight: 600; }
.dx { overflow-x: auto; }
.dx pre { display: inline-block; min-width: 100%; margin: 0; padding: 4px 0; font: 12px/1.55 var(--mono); }
.dx pre span { display: block; padding: 0 12px; min-height: 1.55em; }
.da { background: color-mix(in srgb, var(--done) 15%, transparent); }
.dd { background: color-mix(in srgb, var(--canceled) 13%, transparent); }
.dh { color: var(--accent-ink); background: var(--accent-soft); }
.dm { color: var(--text-3); }

/* ---------- an agent's trace ---------- */
.trace { display: grid; gap: 10px; max-width: 920px; padding: 20px 28px 40px; min-width: 0; }
.tsleep { display: flex; align-items: center; gap: 8px; padding: 2px 6px; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.tsleep::before { content: ''; width: 2px; height: 18px; border-radius: 1px; background: var(--line); }
.tmsgs { margin: 4px 0 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--raise); overflow: hidden; }
.tmsgs .msg { padding-top: 6px; padding-bottom: 6px; }
.ts.sent .ti { color: var(--accent-ink); }
.tsum { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 0 4px; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.tsum b { color: var(--text-2); font-weight: 620; }
.tses { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.tses > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--side); min-width: 0; }
.tses > summary::-webkit-details-marker, .ts details > summary::-webkit-details-marker { display: none; }
.tses[open] > summary { border-bottom: 1px solid var(--line); }
.tsn { flex: none; font-weight: 650; font-size: 13px; }
.tsm { flex: 1; min-width: 0; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.tst { flex: none; font: 11px/1.6 var(--mono); padding: 0 7px; border-radius: 999px; background: var(--cell); color: var(--text-2); }
.tst.ok, .tst.live { color: var(--done-ink); } .tst.bad { color: var(--canceled); }
.tsb { display: grid; gap: 1px; padding: 6px 0 8px; min-width: 0; }
.ts { display: flex; gap: 9px; padding: 4px 12px; min-width: 0; align-items: flex-start; font-size: 13px; line-height: 1.45; }
.ts .ti { flex: none; width: 15px; height: 15px; margin-top: 2px; color: var(--text-3); }
.ts .ti svg { width: 14px; height: 14px; display: block; }
.ts .tc { flex: 1; min-width: 0; }
.tl { overflow-wrap: anywhere; color: var(--text); white-space: pre-wrap; }
.tl.mono { font: 12.2px/1.5 var(--mono); }
.tl .who { font-weight: 650; }
.ts details > summary { list-style: none; cursor: pointer; }
.ts details > summary .tl { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ts details[open] > summary .tl { display: block; }
.tmeta { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.tmeta .bad, .ts.err .tl { color: var(--canceled); }
.tout { margin: 4px 0 2px; padding: 6px 9px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 7px; font: 11.8px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; color: var(--text-2); }
.ts.say .tl { font-size: 14px; line-height: 1.5; }
.ts.told { margin: 2px 8px 4px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); }
.ts.told .ti { color: var(--accent-ink); }
.ts.think .tl { color: var(--text-2); font-style: italic; }
.ts.say-team .ti { color: var(--accent-ink); }
.ts.warned .tl, .ts.warned .ti { color: var(--doing); }
.tkids { margin: 6px 0 2px; padding-left: 4px; border-left: 2px solid var(--line); display: grid; gap: 1px; }
.tkids .ts { padding-left: 8px; }
.tdiv { display: flex; align-items: center; gap: 8px; padding: 4px 12px; font-size: 11.5px; color: var(--text-3); }
.tdiv::before, .tdiv::after { content: ''; flex: 1; border-top: 1px dashed var(--line); }
.todo { list-style: none; margin: 2px 0 0; padding: 0; }
.todo li::before { content: '○ '; color: var(--text-3); }
.todo li.done { color: var(--text-3); text-decoration: line-through; }
.todo li.done::before { content: '● '; color: var(--done); }

/* ---------- overlays ---------- */
#scrim { display: none; position: fixed; inset: 0; background: rgba(10, 10, 12, .32); z-index: 20; }
#fatal { display: none; position: fixed; inset: 0; z-index: 40; background: var(--bg); place-items: center; padding: 24px; }
#fatal.on { display: grid; }
#fatal .box { max-width: 420px; text-align: center; }
#fatal h1 { font-size: 20px; letter-spacing: -.015em; margin: 0 0 6px; }
#fatal p { color: var(--text-2); line-height: 1.55; }

/* ---------- narrow screens ---------- */
@media (max-width: 1279px) { .tl-hint { display: none; } }
@media (max-width: 759px) {
  #app { grid-template: "main" minmax(0, 1fr) "tl" auto / minmax(0, 1fr); }
  #side { position: fixed; top: 0; left: 0; bottom: 0; width: min(288px, 86vw); z-index: 30; transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--shadow); }
  body.side-open #side { transform: none; }
  body.side-open #scrim { display: block; }
  #main, #tl { border-left: 0; }
  .hbtn { display: grid; }
  #head { padding: 0 14px; gap: 10px; }
  #headRight:not(:has(.state)), #head .hmono, #speeds, #tlB { display: none; }
  .msg, .act, .divider, .intro { padding-left: 14px; padding-right: 14px; }
  .icard { margin-left: 14px; margin-right: 14px; }
  .page, .blist, .bside, .trace { padding-left: 14px; padding-right: 14px; }
  .board { display: block; }
  .bside { border-left: 0; border-top: 1px solid var(--line); }
  .irow { grid-template-columns: 16px 30px minmax(0, 1fr) auto; }
  .irow .when, .irow .who span:last-child { display: none; }
  .crow { padding-left: 14px; padding-right: 14px; }
  .tile { padding: 12px 14px; } .tile .v { font-size: 22px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .drow { grid-template-columns: 40px minmax(0, 1fr); } .drow .kd { grid-column: 2; grid-row: 1; } .drow .tx { grid-column: 2; }
  #tl { gap: 10px; padding-left: 12px; padding-right: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Run">
    <div class="ws"><div class="ws-name" id="wsName">Connecting</div><div class="ws-st"><span class="dot" id="wsDot"></span><span id="wsState">Loading</span></div></div>
    <input id="filter" type="search" placeholder="Search messages" aria-label="Search messages and conversations">
    <nav id="nav"></nav>
  </aside>

  <main id="main">
    <header id="head">
      <button class="hbtn" id="sideBtn" aria-label="Menu"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h13"/></svg></button>
      <div id="headMain"></div>
      <div id="headRight"></div>
    </header>
    <div id="convPane" class="pane"><div id="msgs" class="msgs"><div class="ghost">Loading the run…</div></div></div>
    <div id="boardPane" class="pane" hidden></div>
    <div id="statsPane" class="pane" hidden></div>
    <div id="patternsPane" class="pane" hidden></div>
    <div id="agentPane" class="pane" hidden></div>
    <div id="tracePane" class="pane" hidden></div>
    <div id="commitsPane" class="pane" hidden></div>
    <div id="searchPane" class="pane" hidden></div>
    <aside id="drawer" aria-label="Details"><div class="dhead" id="dHead"></div><div id="dScroller"><div id="dMsgs" class="msgs"></div></div></aside>
    <button id="jump" hidden>Jump to latest ↓</button>
    <div id="banner"></div>
  </main>

  <aside id="rail" aria-label="Spend, agents and board"></aside>

  <footer id="tl">
    <button id="liveBtn"><span class="dot"></span><span id="liveTxt">Live</span></button>
    <button id="play" aria-label="Play"></button>
    <span id="tlA">0:00</span>
    <div id="track" tabindex="0" role="slider" aria-label="Run timeline" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i class="tb"></i><i class="tf" id="tlFill"></i><span id="marks"></span><i class="tt" id="tlThumb"></i><div id="tip"></div></div>
    <span id="tlB"></span>
    <div class="seg" id="speeds"></div>
    <span class="tl-hint">Drag to see the run at any moment</span>
  </footer>
</div>
<div id="scrim"></div>
<div id="fatal"><div class="box"><h1 id="fatalH"></h1><p id="fatalP"></p></div></div>

<script>
'use strict';

/* ================= constants ================= */
const GROUP_GAP = 300;         // consecutive messages from one author within this many seconds share a header
const DIVIDER_GAP = 900;       // a quiet gap this long draws a time divider in the conversation
const CAP = 500;               // conversation rows kept in the DOM; older ones load on scroll
const ACTIVE_GAP = 120;        // an agent is active while its model calls come less than this many seconds apart
const STATUSES = ['doing', 'todo', 'done', 'canceled'];
const STATUS_LABEL = { todo: 'To do', doing: 'Doing', done: 'Done', canceled: 'Canceled' };
const CLOSED = new Set(['done', 'canceled']);
const GROUPS = { all: 'all', channel: 'channel', here: 'channel' };   // the control plane's group mentions
const SYSTEM = 'swarmory';     // the author of what the control plane posts itself, such as a job's result
const MAIN = 'refs/heads/main';
const SHA = /^[0-9a-f]{7,40}$/;
const SPEEDS = [1, 10, 60];
const PANES = ['conv', 'board', 'stats', 'patterns', 'agent', 'trace', 'commits', 'search'];
const EMPTY = [];

const SVG = {
  todo: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="var(--bg)" stroke="var(--todo)" stroke-width="1.8"/></svg>',
  doing: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="var(--bg)" stroke="var(--doing)" stroke-width="1.8"/><path d="M8 4.6a3.4 3.4 0 0 1 0 6.8z" fill="var(--doing)"/></svg>',
  done: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="var(--done)" stroke="var(--done)" stroke-width="1.8"/><path d="M5.2 8.2l2 2 3.8-4.2" fill="none" stroke="var(--bg)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  canceled: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="var(--todo)" stroke="var(--todo)" stroke-width="1.8"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round"/></svg>',
  play: '<svg viewBox="0 0 14 14" fill="currentColor"><path d="M3.5 2.2v9.6a.6.6 0 0 0 .9.5l7.6-4.8a.6.6 0 0 0 0-1L4.4 1.7a.6.6 0 0 0-.9.5z"/></svg>',
  pause: '<svg viewBox="0 0 14 14" fill="currentColor"><rect x="3" y="2" width="3" height="10" rx=".8"/><rect x="8" y="2" width="3" height="10" rx=".8"/></svg>',
  open: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 2.5v7M2.5 6h7"/></svg>',
  person: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="4.3" r="2"/><path d="M2.6 10.2c.5-1.9 1.8-2.9 3.4-2.9s2.9 1 3.4 2.9" stroke-linecap="round"/></svg>',

      if (ended && begun > ended) w.append(el('div', 'tsleep', `Slept ${span(begun - ended)}, until ${clock(begun)}`));
      w.append(sessionBlock(id, t, no, evs, no === last, S.live && !S.ended));
      ended = evs.find(e => e.kind === 'end')?.at ?? null;
    }
  }
  sc.replaceChildren(w);
  sc.scrollTop = stick ? sc.scrollHeight : top;
}
function folding(sm) {   // a click on a fold in a trace: remember it, so a repaint keeps it (a toggle event also fires when a repaint opens one)
  const d = sm.parentElement, k = d.dataset.k, t = S.route?.view === 'agent' && TRACES.get(S.route.id);
  if (!k || !t) return;
  if (d.open) { t.open.delete(k); t.shut.add(k); } else { t.open.add(k); t.shut.delete(k); }   // it toggles after this click
}

/* ================= search: every message at the playhead with all the words, newest first ================= */
const HITS = 200;
function query() { return $('filter').value.trim().toLowerCase().split(/\s+/).filter(Boolean); }
function renderSearch(D) {
  const q = query();
  if (!changed('search', q.join(' '), D.nMsgs)) return;
  const hits = [...D.msgs.values()].filter(e => !e.activity && q.every(w => String(e.text).toLowerCase().includes(w))).reverse();
  head('Search', `${plural(hits.length, 'message')} with “${q.join(' ')}” at this point in the run`);
  const list = el('div', 'msgs');
  const mark = new RegExp(q.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');
  for (const e of hits.slice(0, HITS)) { const r = messageRow(e, false, D, null, true, mark); r.classList.add('hit'); list.append(r); }
  if (hits.length > HITS) list.append(el('div', 'ghost', `The newest ${HITS} are shown. Another word narrows it.`));
  $('searchPane').replaceChildren(hits.length ? list : el('div', 'ghost', 'No message has all of those words at this point in the run.'));
  $('searchPane').scrollTop = 0;
}
function showMsg(id) {   // open a message where it lives, its thread in the drawer if it is a reply
  const e = D?.msgs.get(id), th = D?.thread.get(id);
  if (!e) return;
  $('filter').value = '';
  S.reveal = { id, conv: e.conv };
  go({ view: 'conv', id: e.conv, drawer: th && th.id !== id ? th.id : null });
  schedule();
}
function reveal() {
  if (sel() !== S.reveal.conv) return;
  const m = (S.route.drawer && drawerView.mids.get(S.reveal.id)) || mainView.mids.get(S.reveal.id);
  if (m) { S.reveal = null; m.scrollIntoView({ block: 'center' }); m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash'); }
  else if (mainView.first) earlier(mainView);
  else S.reveal = null;
}

/* ================= commits on main, newest first, as of the playhead ================= */
const COMMITS_MOST = 500;   // /commits answers with main's latest this many
let commitV = 0;
function api(path) { return fetch(path, { headers: { Authorization: 'Bearer ' + S.token }, cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(r.status)); }
function loadCommits() {
  const v = ++commitV;
  api('commits').then(j => {
    if (v !== commitV) return;
    S.commits = j.commits.reverse();   // oldest first, in main's own order
    S.cidx = new Map(S.commits.map((c, i) => [c.sha, i]));
    for (const n of document.querySelectorAll('[data-sha]')) n.replaceWith(shaRef(n.dataset.sha));
    for (const b of document.querySelectorAll('.qcard.push')) fillPush(b);
    deps.clear();   // every view may show a commit
    schedule();
  }, () => {});
}
function commitOf(x) { return x && x.length >= 7 && S.commits?.find(c => c.sha.startsWith(x)) || null; }   // a commit /commits listed, by its sha or the start of one
function patchOf(sha) {   // what /commit says of it, asked once
  if (!S.patches.has(sha)) {
    S.patches.set(sha, null);
    api('commit?sha=' + sha).then(j => S.patches.set(sha, j), () => S.patches.set(sha, false)).finally(schedule);
  }
  return S.patches.get(sha);
}
function lines(f) { return f.add == null ? [el('span', 'dm', 'binary')] : [el('span', 'add', '+' + f.add), el('span', 'del', '−' + f.del)]; }
function churn(c) { const f = c.files; return [f.length, f.reduce((n, x) => n + (+x.add || 0), 0), f.reduce((n, x) => n + (+x.del || 0), 0)]; }
function renderCommits(D, T) {   // main's commits and the pushes the control plane refused, newest first
  const main = onMain(T), n = main.all.n, dr = S.route.drawer, refused = D.pushes.filter(p => !p.ok);
  head('Commits', main.capped ? `latest ${COMMITS_MOST} on main, ${n} of them by ${rel(T)}` : n ? `on main by ${rel(T)}` : 'nothing on main yet',
    [n && plural(n, 'commit'), refused.length && `${plural(refused.length, 'push', 'pushes')} refused`].filter(Boolean).join(' · '));
  if (!changed('commits', n, dr, refused.length)) return;
  const list = el('div', 'clist'), shown = (S.commits || EMPTY).slice(0, n).reverse();
  for (const p of refused) { const i = shown.findIndex(c => c.at <= p.at); shown.splice(i < 0 ? shown.length : i, 0, p); }   // a refusal goes above what was committed before it
  for (const c of shown) {
    if (c.type === 'push') {
      const m = box('div', 'cmain', el('div', 'cs', oneLine(c.reason, 300) || 'No reason given'),
        el('div', 'cmeta', `push refused · ${nameOf(c.by)} · ${rel(c.at)}${c.ref && c.ref !== MAIN ? ' · ' + c.ref : ''}`));
      m.title = c.reason || '';
      list.append(box('div', 'crow rf', avatar(c.by, 26), m));
      continue;
    }
    const [nf, add, del] = churn(c), a = whoOf(c);
    const b = box('button', 'crow' + (c.sha === dr ? ' sel' : ''), avatar(a, 26), box('div', 'cmain', el('div', 'cs', c.subject || '(no subject)'),
      box('div', 'cmeta', el('span', 'csha', c.sha.slice(0, 7)), `${nameOf(a)} · ${rel(c.at)} · ${plural(nf, 'file')}`, el('span', 'add', '+' + add), el('span', 'del', '−' + del))));
    b.dataset.drawer = c.sha;
    list.append(b);
  }
  $('commitsPane').replaceChildren(shown.length ? list : el('div', 'ghost', main.capped ? `None of main’s latest ${COMMITS_MOST} commits was on it by this point in the run.` : 'Nothing was on main by this point in the run.'));
}
function paintCommit(c, d) {   // c: the commit as /commits or /commit told it, or null; d: what /commit said, null while asking, false if it is not on main
  const w = el('div', 'cdet');
  if (!c) w.append(el('div', 'ghost', d === null ? 'Loading…' : 'No commit on main has this sha.'));
  else {
    if (d?.body?.trim()) w.append(el('div', 'tx cbody', d.body.trim()));
    if (c.files) {   // a commit from /commit has its patch, not the list's file counts
      const [nf, add, del] = churn(c), fl = el('div', 'cfiles');
      for (const f of c.files) { const b = el('button', 'cf'); b.dataset.file = f.path; b.append(el('span', null, f.path), ...lines(f)); fl.append(b); }
      w.append(el('div', 'cmeta', `${plural(nf, 'file')} changed, ${add} added, ${del} removed`), fl);
    }
    if (d) w.append(diffView(d.patch, c.files || EMPTY));
    if (d?.truncated) w.append(el('div', 'ghost', 'The diff is cut off here: it is too long to show in full.'));
    if (!d) w.append(el('div', 'ghost', d === false ? 'The control plane could not show this diff.' : 'Loading the diff…'));
  }
  drawerView.id = null;   // a thread painted here next starts afresh
  drawerView.box.replaceChildren(w);
  drawerView.sc.scrollTop = 0;
}
const DIFF = [['@@', 'dh'], ['+', 'da'], ['-', 'dd'], [' ', '']];
function diffView(patch, files, only) {   // only: the one file to show
  const frag = document.createDocumentFragment();
  let pre = null;
  for (const line of patch.split('\n')) {
    if (line.startsWith('diff --git ')) {
      const path = line.match(/ b\/(.*)$/)?.[1] || line.slice(11);
      pre = null;
      if (only && path !== only) continue;
      const f = files.find(x => x.path === path), file = el('div', 'df'), h = el('div', 'dfh'), dx = el('div', 'dx');
      file.dataset.path = path;
      h.append(el('span', null, path));
      if (f) h.append(...lines(f));
      dx.append(pre = el('pre'));
      file.append(h, dx);
      frag.append(file);
    } else if (pre && line && !/^(---|\+\+\+|index) /.test(line)) {
      pre.append(el('span', DIFF.find(([p]) => line.startsWith(p))?.[1] ?? 'dm', line));
    }
  }
  return frag;
}

/* ================= the drawer: a commit's patch, or the replies to a message ================= */
function renderDrawer(id, D, stick) {
  const k = !id ? null : /^m\d+$/.test(id) ? 'thread' : SHA.test(id) ? 'commit' : null;   // anything else a link carries opens nothing
  $('drawer').classList.toggle('on', !!k);
  if (!k) return;
  const th = D.thread.get(id), listed = k === 'commit' ? commitOf(id) : null, d = k === 'commit' ? patchOf(listed?.sha || id) : null, c = listed || d || null;
  if (changed('drawer', id, th?.conv, listed?.sha, d ? d.sha : d)) {
    const x = el('button', 'xbtn');
    x.innerHTML = SVG.close; x.dataset.close = ''; x.setAttribute('aria-label', 'Close');
    const col = k === 'thread' ? box('div', 'hcol', el('div', 'htitle', 'Thread'), el('span', 'hsub', th ? convTitle(th.conv, D) : ''))
      : box('div', 'hcol', el('div', 'htitle', c ? c.subject || '(no subject)' : id.slice(0, 7)),
        el('span', 'hsub', c ? `${c.sha.slice(0, 7)} · ${nameOf(whoOf(c))} · committed ${clock(c.at)}` : d === null ? 'Loading' : 'Not a commit on main'));
    $('dHead').replaceChildren(...[c && avatar(whoOf(c), 32), col, x].filter(Boolean));
    if (k === 'commit') paintCommit(c, d);
  }
  if (k === 'thread') paintConv(drawerView, 'thread:' + id, D, stick);
}

/* ================= time bar: where the playhead is in the run, with a mark for each push to main ================= */
const track = $('track'), tip = $('tip');
function drawTrack(T) {
  const t0 = start(), t1 = Math.max(present(), t0 + 1), f = Math.max(0, Math.min(1, (T - t0) / (t1 - t0)));
  $('tlFill').style.width = $('tlThumb').style.left = (f * 100).toFixed(2) + '%';
  track.setAttribute('aria-valuenow', String(Math.round(f * 100)));
  track.setAttribute('aria-valuetext', `${rel(T)} into the run, ${clock(T)}`);
  if (!changed('marks', S.pushes.length, S.people.size, S.live ? Math.floor(Math.log(t1 - t0) * 500) : t1)) return;   // a live run's marks move as it grows
  const seen = new Set(), frag = document.createDocumentFragment();
  for (const e of S.pushes) {   // one mark per pusher per thousandth of the bar
    const x = Math.round((e.at - t0) / (t1 - t0) * 1000) / 10, col = colorOf(e.by);
    if (seen.has(x + col)) continue;
    seen.add(x + col);
    const i = el('i');
    i.style.left = x + '%'; i.style.background = col;
    frag.append(i);
  }
  $('marks').replaceChildren(frag);
}
function tAtX(x) {
  const r = track.getBoundingClientRect(), t0 = start(), t1 = Math.max(present(), t0 + 1);
  return t0 + Math.max(0, Math.min(1, (x - r.left) / r.width)) * (t1 - t0);
}
function seek(t, final) {
  S.playing = false;
  const p = present();
  if (final && p - t < (p - start()) * 0.004) { S.follow = true; }
  else { S.follow = false; S.T = t; }
  scrubbing = true;
  schedule();
}
let scrubbing = false, dragging = false;
track.addEventListener('pointerdown', e => { dragging = true; track.setPointerCapture(e.pointerId); seek(tAtX(e.clientX)); });
track.addEventListener('pointermove', e => {
  const r = track.getBoundingClientRect(), t = tAtX(e.clientX), near = (present() - start()) * 4 / r.width;
  if (dragging) seek(t);
  const p = S.pushes[countUpTo(S.pushes, t + near, evT) - 1];
  tip.style.display = 'block';
  tip.style.left = Math.max(60, Math.min(r.width - 60, e.clientX - r.left)) + 'px';
  tip.textContent = `${rel(t)} · ${clock(t)}` + (p && p._t >= t - near ? ` · ${nameOf(p.by)} pushed ${String(p.new).slice(0, 7)}` : '');
});
track.addEventListener('pointerup', e => { if (dragging) { dragging = false; seek(tAtX(e.clientX), true); } });
track.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
track.addEventListener('keydown', e => {
  const T = cursor();
  let t = null;
  const stops = S.ev.filter(x => x.type === 'message' || x.type === 'move' || x.type === 'issue' || x.type === 'push').map(evT);
  if (e.key === 'ArrowRight') t = e.shiftKey ? T + 30 : (stops.find(x => x > T + 1e-6) ?? present());
  else if (e.key === 'ArrowLeft') { if (e.shiftKey) t = T - 30; else { const i = countUpTo(stops, T - 1e-6, tOf); t = i > 0 ? stops[i - 1] : start(); } }
  else if (e.key === 'Home') t = start();
  else if (e.key === 'End') t = present();
  if (t == null) return;
  e.preventDefault();
  seek(t, true);
});

/* playback */
let lastFrame = 0;
function setPlaying(on) {
  S.playing = on;
  if (on) {
    S.T = S.follow || cursor() >= present() - 0.01 ? start() : cursor();
    S.follow = false; lastFrame = 0;
  }
  schedule();
}
$('play').addEventListener('click', () => setPlaying(!S.playing));
for (const s of SPEEDS) {
  const b = el('button', null, s + '×');
  b.dataset.speed = s; b.title = `Replay at ${s} times the run’s speed`;
  b.addEventListener('click', () => { S.speed = s; renderSpeeds(); });
  $('speeds').append(b);
}
function renderSpeeds() { for (const b of $('speeds').children) b.classList.toggle('on', +b.dataset.speed === S.speed); }
renderSpeeds();
$('liveBtn').addEventListener('click', () => { S.follow = true; S.playing = false; scrubbing = true; schedule(); });

/* ================= the run's name and state, and the time bar's words ================= */
function renderChrome(T) {
  const run = S.run || {}, live = S.live, left = run.deadline - serverNow();
  $('wsName').textContent = run.mission || 'swarmory';
  $('wsName').title = run.run || '';
  document.title = (run.mission ? run.mission + ' · ' : '') + 'swarmory';
  $('wsDot').className = 'dot' + (live ? ' on' : '');
  $('wsState').textContent = live ? 'Running' + (left > 0 ? ` · ${span(left)} left` : '') : S.ended ? `Ended · last activity at ${rel(present())}` : 'Loading';
  $('wsState').title = run.deadline ? 'Deadline ' + new Date(run.deadline * 1000).toLocaleString() : '';
  $('tlA').textContent = rel(T);
  $('tlB').textContent = 'of ' + span(present() - start());
  const play = $('play'), pk = S.playing ? 'pause' : S.follow ? 'start' : 'here';
  if (changed('play', pk)) {
    play.innerHTML = S.playing ? SVG.pause : SVG.play;
    play.setAttribute('aria-label', S.playing ? 'Pause' : 'Replay from here');
    play.title = S.playing ? 'Pause' : (S.follow ? 'Replay the run from the start' : 'Play from here');
  }
  $('liveBtn').className = S.follow ? 'at' + (live ? ' live' : '') : '';
  $('liveTxt').textContent = S.follow ? (live ? 'Live' : 'End of run') : S.playing ? `Replaying at ${S.speed}×` : (live ? 'Back to live' : 'Jump to end');
}

/* ================= frame loop ================= */
let raf = 0, shown = '';
function schedule() { if (!raf) raf = requestAnimationFrame(frame); }
function show(mode) {
  if (mode === shown) return;
  shown = mode; deps.delete('head');
  document.body.dataset.mode = mode;
  for (const p of PANES) $(p + 'Pane').hidden = p !== mode;
}
function updateJump() { const sc = mainView.sc; $('jump').hidden = shown !== 'conv' || sc.scrollHeight - sc.scrollTop - sc.clientHeight < 240; }
function frame(ts) {
  raf = 0;
  if (S.playing) {
    if (lastFrame) S.T += (ts - lastFrame) / 1000 * S.speed;
    lastFrame = ts;
    if (S.T >= present()) { S.playing = false; S.follow = true; }
    else schedule();
  }
  if (!S.loaded && !S.ev.length) { renderChrome(0); return; }
  const T = cursor();
  fold(T);
  if (!S.route) {
    const id = D.main || [...D.convs.keys()][0];
    if (id) S.route = { view: 'conv', id };
  }
  renderChrome(T);
  const r = S.route, stick = S.playing || scrubbing, mode = !r ? 'conv' : query().length ? 'search' : r.view === 'agent' && r.sub ? 'trace' : r.view;
  show(mode);
  if (mode !== 'search') deps.delete('search');   // so coming back repaints it
  if (mode === 'search') renderSearch(D);
  else if (mode === 'board') renderBoard(D, T);
  else if (mode === 'stats') renderStats(D, T);
  else if (mode === 'patterns') renderPatterns(D, T);
  else if (mode === 'commits') renderCommits(D, T);
  else if (mode === 'trace') renderTrace(r.id, T);
  else if (mode === 'agent') renderAgentPage(r.id, D, T);
  else if (r) { renderHead(r.id, D); paintConv(mainView, r.id, D, stick); renderRail(D, T); }
  if (r) renderDrawer(mode === 'search' ? null : r.drawer, D, stick);   // search results take the whole pane
  updateJump();
  if (S.reveal) reveal();
  renderNav(D, T);
  drawTrack(T);
  scrubbing = false;
}

/* ================= navigation ================= */
window.addEventListener('hashchange', () => {
  S.route = parseRoute() || S.route;
  $('filter').value = '';
  document.body.classList.remove('side-open');
  schedule();
});
document.addEventListener('click', e => {
  const t = e.target, at = s => t.closest(s);
  if (at('#tracePane .trace details > summary')) return folding(at('summary'));
  const more = at('.more-tx');
  if (more) { const tx = more.previousElementSibling; more.textContent = tx.classList.toggle('open') ? 'Show less' : 'Show more'; return; }
  if (at('.more')) return earlier(at('#drawer') ? drawerView : mainView);
  if (at('.att, a')) return;
  const sh = at('button.sha');
  if (sh) return go({ ...S.route, drawer: commitOf(sh.dataset.sha).sha });
  const j = at('[data-jump]') || at('.hit')?.querySelector('[data-jump]');   // anywhere on a search hit opens it, as its button does
  if (j) return showMsg(j.dataset.jump);
  const dw = at('[data-drawer]');
  if (dw) return go({ ...S.route, drawer: dw.dataset.drawer });
  const fl = at('[data-file]');
  if (fl) return $('dMsgs').querySelector(`.df[data-path="${CSS.escape(fl.dataset.file)}"]`)?.scrollIntoView({ block: 'start', behavior: 'smooth' });
  const tg = at('[data-toggle]');
  if (tg) { S[tg.dataset.toggle] = !S[tg.dataset.toggle]; return schedule(); }
  if (at('[data-close]')) return go({ ...S.route, drawer: null });
  const to = at('[data-agent]') ? { view: 'agent', id: at('[data-agent]').dataset.agent } : at('[data-route]') ? { view: at('[data-route]').dataset.route }
    : at('[data-conv]') ? { view: 'conv', id: at('[data-conv]').dataset.conv } : null;
  if (!to) return;
  if (hashOf(to) === location.hash) { $('filter').value = ''; document.body.classList.remove('side-open'); schedule(); }
  go(to);
});
$('filter').addEventListener('input', schedule);
$('filter').addEventListener('keydown', e => { if (e.key === 'Enter') document.body.classList.remove('side-open'); });
$('sideBtn').addEventListener('click', () => document.body.classList.toggle('side-open'));
$('scrim').addEventListener('click', () => document.body.classList.remove('side-open'));
$('convPane').addEventListener('scroll', () => { updateJump(); if (mainView.sc.scrollTop < 200) earlier(mainView); }, { passive: true });
$('dScroller').addEventListener('scroll', () => { if (drawerView.sc.scrollTop < 200) earlier(drawerView); }, { passive: true });
$('jump').addEventListener('click', () => { const sc = mainView.sc; sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' }); });
document.addEventListener('keydown', e => {
  const f = $('filter');
  if (e.key === 'Escape' && f.value && (e.target === f || !S.route?.drawer)) { f.value = ''; return schedule(); }
  if (e.key === 'Escape' && S.route?.drawer) return go({ ...S.route, drawer: null });
  if (e.key === 'Escape') document.body.classList.remove('side-open');
  if (e.key === ' ' && !e.target.closest('button, input, a, summary, #track')) { e.preventDefault(); setPlaying(!S.playing); }
});
window.addEventListener('resize', schedule);
setInterval(() => { if (!S.playing) schedule(); }, 1000);

/* ================= feed ================= */
function fatal(h, p) {
  $('fatalH').textContent = h; $('fatalP').textContent = p;
  $('fatal').classList.add('on');
}
function banner(text) { const b = $('banner'); b.textContent = text || ''; b.classList.toggle('on', !!text); }
let failures = 0;
async function poll() {
  let res;
  try {
    res = await fetch(`feed?log=${S.off.log}&ledger=${S.off.ledger}`, { headers: { Authorization: 'Bearer ' + S.token }, cache: 'no-store' });
  } catch (err) {
    failures++;
    banner('Lost the connection to the control plane. Retrying…');
    return setTimeout(poll, Math.min(15000, 1000 * 2 ** failures));
  }
  if (res.status === 401 || res.status === 403) return fatal('This link doesn’t open this run', 'The view token in the link was not accepted. Ask whoever shared it for the link that `swarmory status RUN` prints.');
  if (!res.ok) {
    failures++;
    banner(`The control plane answered ${res.status}. Retrying…`);
    return setTimeout(poll, Math.min(15000, 1000 * 2 ** failures));
  }
  let j;
  try { j = await res.json(); } catch { failures++; return setTimeout(poll, 3000); }
  failures = 0; banner('');
  const got = ingest(j);
  if (!S.loaded && !j.more) S.loaded = scrubbing = true;   // caught up
  if (got || S.loaded) schedule();
  if (j.more) return setTimeout(poll, 0);           // the answer was cut at its size cap
  if (!S.live) { S.ended = true; schedule(); return; }   // a run that has ended, all of it read
  setTimeout(poll, 2000);
}
if (!S.token) fatal('This link has no view token', 'A viewer link ends in #TOKEN. Open the full link that `swarmory status RUN` prints.');
else { schedule(); poll(); }
</script>
</body>
</html>
